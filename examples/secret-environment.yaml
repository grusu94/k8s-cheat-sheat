apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
spec:
  containers:
  - name: secret-env-container
    image: redis:latest
    env:
    - name: SECRET_USERNAME
      valueFrom:
        secretKeyRef:
          name: simple-secret
          key: username
    - name: SECRET_PASSWORD
      valueFrom:
        secretKeyRef:
          name: simple-secret
          key: password